name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Formatting is the only check that does not need a Metal toolchain, because
  # rustfmt parses rather than builds. It runs on Linux so a broken macOS image
  # cannot hide a formatting regression.
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # The Qwen3.5 kernels on a CPU emulator, against transformers' own code.
  #
  # Linux, because it needs no Metal toolchain: tools/msl_emu compiles the
  # kernel sources as C++ and runs every threadgroup on real threads. Four
  # passes, each catching what the others cannot, plus the whole-model check
  # (a small random Qwen3_5ForCausalLM through every kernel and tessl's own
  # flash_attn_rows, against the model's logits): plain (numerics, three
  # threadgroup orders that must agree bit for bit), fast-math (the on-device
  # error bounds under perturbed transcendentals), AddressSanitizer (any
  # out-of-bounds device or threadgroup access), ThreadSanitizer (missing
  # barriers). The host-contract case also holds src/qwen35.rs's buffer binds
  # and constants to the kernel signatures.
  # ---------------------------------------------------------------------------
  kernel-emulator:
    name: qwen35 kernels (CPU emulator vs transformers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/msl_emu/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: MSL dialect lint
        # No Metal compiler on Linux: fail instead on any construct the Qwen3.5
        # kernels use that no compiling tessl kernel uses and nobody reviewed.
        # The lint is std-only (the crate itself does not build on Linux), so a
        # bare rustc compiles it.
        run: |
          rustc --edition 2021 -O -o "$RUNNER_TEMP/dialect_lint" src/bin/dialect_lint.rs
          "$RUNNER_TEMP/dialect_lint"
      - name: Install the oracle
        run: pip install -r tools/msl_emu/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Emulator vs transformers
        run: python3 tools/msl_emu/check_qwen35.py
      - name: Whole model vs transformers (prefill, cached decode, shared snapshot)
        run: python3 tools/msl_emu/check_qwen35_model.py
      - name: Fast-math bounds
        run: MSL_EMU_OUT=/tmp/emu-fast python3 tools/msl_emu/check_qwen35.py --fast-math
      - name: Let the sanitizers map their shadow memory
        # Recent runner kernels randomise mmap with 32 bits, which leaves ASan
        # and TSan no room for their fixed shadow ranges ("unexpected memory
        # mapping"). 28 is the long-standing default.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: AddressSanitizer
        run: |
          MSL_EMU_SANITIZE=address MSL_EMU_OUT=/tmp/emu-asan python3 tools/msl_emu/check_qwen35.py
          MSL_EMU_SANITIZE=address MSL_EMU_OUT=/tmp/emu-asan python3 tools/msl_emu/check_qwen35_model.py
      - name: ThreadSanitizer
        # Every case is slow under TSan; these cover each kernel's barrier structure.
        run: >-
          MSL_EMU_SANITIZE=thread MSL_EMU_OUT=/tmp/emu-tsan TSAN_OPTIONS=halt_on_error=1
          python3 tools/msl_emu/check_qwen35.py
          -k chunk_T65,chunk_ws,recurrent_T7,recurrent_in_place,gated_norm,score,conv_short,qk_norm,attn_gate,sq_sum_pieces

  # ---------------------------------------------------------------------------
  # Everything that compiles, on a runner that can compile shaders.
  #
  # `build.rs` AOT-compiles kernels/*.metal by shelling out to `xcrun metal`, so
  # this is not only the test job's problem: `cargo check` and `cargo clippy`
  # both run build scripts, and neither can succeed without the Metal compiler.
  # That compiler is NOT part of Xcode. Locally it resolves to
  # `~/Library/Developer/DVTDownloads/MetalToolchain/.../metal`, which is a
  # separately downloaded cryptex component. On a fresh runner it is absent, and
  # without the download step below every cargo invocation here dies inside
  # build.rs with a spawn failure that names no cause.
  # ---------------------------------------------------------------------------
  check:
    name: build + clippy + docs
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Python for the source-text gates
        # The parity harness below needs numpy.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/msl_emu/requirements.txt

      - name: Report the toolchain this runner actually has
        # Recorded rather than assumed: the image's default Xcode floats, and
        # GitHub has already announced one move for macOS 26. If a future image
        # ships an Xcode whose Metal compiler rejects these kernels, the version
        # that did it is in the log.
        run: |
          echo "xcode-select: $(xcode-select -p)"
          xcodebuild -version
          sw_vers

      - name: Install the Metal Toolchain
        # Idempotent: already-present is the common case once the cache warms,
        # and downloading takes minutes.
        run: |
          if xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler already present: $(xcrun --find metal)"
          else
            echo "Metal compiler absent; downloading the component"
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Prove the Metal compiler runs
        # `-downloadComponent` can report success while leaving nothing runnable.
        # A component that failed to install and one that installed correctly
        # must not produce the same CI result, so this asserts the compiler
        # actually executes before anything depends on it.
        run: |
          xcrun --find metal
          xcrun metal --version

      - name: Build
        run: cargo build --release --all-targets

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Clippy (quant-prep)
        # `mtl_tensor` is compiled only with `quant-prep`, so the run above
        # never sees it.
        run: cargo clippy --release --all-targets --features quant-prep -- -D warnings

      - name: Rustdoc
        # `[package.metadata.docs.rs]` renders this crate for
        # aarch64-apple-darwin, so the configuration readers see is the one
        # checked here.
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Device-free tests, device hidden
        # Every cargo test that constructs no GpuRuntime, run on every push
        # instead of waiting for the gated GPU runner: the whole device-free
        # integration binaries, plus the device-free tests that live in mixed
        # files and in the library, listed in scripts/hosted_tests.txt.
        #
        # scripts/hosted_tests.sh is the one guard for every invocation. It fails
        # on a filter that runs zero tests (cargo exits 0 on that), on an
        # `--exact` name that matches nothing, and on a malformed list. It runs the
        # tests under a sandbox profile that denies IOKit, so the Metal device is
        # invisible even if this runner exposes one: a test that opens a device
        # fails here, it is never skipped. tests/hosted_selection.rs keeps the
        # list honest from source, and tests/hosted_tests_script.rs holds the
        # guard to failing.
        run: scripts/hosted_tests.sh

      - name: Hosted manifest is complete
        # Every test that passes with the device hidden must be selected by
        # scripts/hosted_tests.txt, or hosted CI never runs it (a new test in a
        # mixed file, a src/bin unit test). tests/hosted_completeness.rs lists
        # every test binary, runs the unselected tests by name under the same
        # IOKit-denying sandbox and fails on any that passes. It is an `outside`
        # entry because it starts those sandboxed children itself and
        # sandbox-exec does not nest.
        run: scripts/hosted_tests.sh --outside

      - name: Parity harness, host-only sections
        # Needs numpy only. The pin is the one tools/msl_emu/requirements.txt
        # already carries for the oracle, so there is a single place to bump it.
        # A non-zero exit (an assertion failure, or a required section that did
        # not run) fails the job; the GPU sections are skipped visibly under
        # --pure and say so.
        #
        # TESSL_HOSTED=1: this runner has Xcode and has just built the release
        # binaries, so a skipped metallib cross-check (no metal-nm, no binary)
        # is a misconfiguration and fails here instead of reading as a pass.
        env:
          TESSL_HOSTED: "1"
        run: |
          python3 -m pip install "$(grep -E '^numpy==' tools/msl_emu/requirements.txt)"
          python3 -I bench/test_parity_harness.py --pure

      - name: Kernel IR fast-math scan (tune rigs included)
        # Compiles every kernels/*.metal, tune included (TESSL_GEMM_TUNE adds
        # kernels/tune/*.metal exactly as build.rs does), to LLVM IR with
        # build.rs's flags and fails on an inf/NaN constant, an fcmp uno/ord, or
        # an isfinite site whose bit test did not survive. Exit 77 means "no
        # Metal compiler"; the step before already proved there is one on this
        # runner, so a skip here is a misconfiguration and fails like any other
        # non-zero exit. tests/check_kernel_ir_planted.rs plants a -INFINITY and
        # holds the script to catching it.
        run: TESSL_GEMM_TUNE=1 scripts/check_kernel_ir.sh

  # ---------------------------------------------------------------------------
  # The GPU suite. Answered by running it, on 2026-08-31.
  #
  # This job was written to gate on `macos-26` because the question could not be
  # settled from documentation: macOS 26 supplies the Metal 4 API and these
  # runners do expose a Metal device — sparsl's probe disproved the opposite
  # assumption — but MPP TensorOps `matmul2d` needs the neural accelerators on
  # M5-class silicon, and the runner image manifest documents no GPU at all.
  #
  # It ran, and the device probe failed. Everything upstream of it succeeded:
  # the Metal Toolchain installed, `xcrun metal --version` executed, and the
  # `check` job compiled every kernel source and linted clean on the same
  # image. So the shaders build on a hosted runner; what fails is executing
  # them. Whether the runner has no Metal 4 device or a device without
  # TensorOps, the consequence for this workflow is identical.
  #
  # Applied here is the remedy this comment named in advance: the job moves to
  # the gated self-hosted runner. NOT `continue-on-error`, which would make a
  # suite that could not run report the same green as one that ran and passed.
  #
  # Gated on a repository variable rather than merely targeting `self-hosted`,
  # because a job whose runner labels match nothing queues indefinitely instead
  # of skipping. Set HAS_METAL_RUNNER to `true` under
  # Settings -> Secrets and variables -> Actions -> Variables once an M5-class
  # runner is registered; until then this skips, and the README's Known Gaps
  # table says so rather than implying the suite runs unattended.
  #
  # Fork exposure: this is a public repository, and GitHub says self-hosted
  # runners "should almost never be used for public repositories" because anyone
  # who can fork and open a pull request can try to compromise the runner
  # (docs.github.com, "Secure use reference"). The `if` below is NOT a security
  # boundary: a pull_request run executes on the PR's merge ref
  # (refs/pull/N/merge; docs.github.com, "Events that trigger workflows"), whose
  # workflow file the fork's author controls, so a PR can simply delete the
  # condition. It only stops an unmodified workflow from queueing fork PRs on
  # the runner by accident. The real controls are owner settings, which nothing
  # here asserts are set:
  #   1. Settings -> Actions -> General -> "Approval for running fork pull
  #      request workflows from contributors": choose "Require approval for all
  #      external contributors" (docs.github.com, "Managing GitHub Actions
  #      settings for a repository").
  #   2. Restrict the runner with a runner group limited to selected
  #      repositories (docs.github.com, "Secure use reference").
  # Do not register a runner on this repository without both.
  # tests/ci_workflow_gates.rs holds every job that is not provably GitHub-hosted
  # to this guard, so the accidental case stays closed.
  # ---------------------------------------------------------------------------
  gpu:
    name: GPU suite on bare metal
    if: ${{ vars.HAS_METAL_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the Metal Toolchain
        run: |
          if xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler already present: $(xcrun --find metal)"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Report which GPU this runner has
        # Printed before anything depends on it, so a later kernel failure can be
        # read against the hardware that produced it instead of guessing.
        run: system_profiler SPDisplaysDataType | head -20

      - name: Device probe
        # The example constructs a GpuRuntime, prints the chipset, and checks a
        # known GEMM result. It is the narrowest thing that distinguishes "no
        # Metal 4 device" from "device present, TensorOps unusable" from
        # "working", and it runs before the suite so the distinction appears at
        # the top of the log rather than inside the full suite.
        run: cargo run --release --example gemm

      - name: Full suite
        # --test-threads=1 is mandatory, not tuning. GPU tests share default
        # command encoders across threads and are not safe to run concurrently.
        #
        # This covers doc tests too: passing a harness argument does not
        # suppress them, and the `Doc-tests tessl` section is part of the suite.
        run: cargo test --release -- --test-threads=1

      - name: mtl_tensor tests (quant-prep)
        # `mtl_tensor` is compiled only with `quant-prep`, so the full suite
        # above builds none of its tests, and the MSRV job only `cargo check`s
        # it. Its device tests call straight into the Metal driver — a
        # stride-less descriptor once segfaulted there on every call — so they
        # need this runner, not just a compile.
        #
        # The filter is checked to have matched: a filter that selects nothing
        # also exits 0, and that must not read as a pass.
        run: |
          out=$(cargo test --release --features quant-prep --lib mtl_tensor:: -- --test-threads=1 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$out" || { echo "mtl_tensor filter matched no tests"; exit 1; }

      - name: Examples run, since the README says they do
        # The quickstart claims these "are compiled and run as examples, so they
        # cannot drift from the API". That claim is only true if something runs
        # them.
        run: |
          cargo run --release --example nn_layer
          cargo run --release --example epilogue_cost

  # ---------------------------------------------------------------------------
  # Cargo.toml claims `rust-version = "1.82"`. Unverified that is just a string
  # in a manifest, so this builds against exactly that toolchain.
  #
  # `--locked` because the MSRV promise is about building the shipped lockfile,
  # not about whatever a fresh resolve happens to pick today.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV 1.82
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - name: Install the Metal Toolchain
        run: |
          if xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler already present"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
      - name: Check the library and all targets
        # `--all-targets` is safe here: this crate declares no dev-dependencies,
        # so the tests build against the same toolchain floor as the library.
        run: cargo check --locked --all-targets
      - name: Check with quant-prep enabled
        # The feature is off by default, which means nothing else in this
        # workflow compiles `mtl_tensor`'s quantized path. A feature that is
        # never built is a feature that has already broken.
        run: cargo check --locked --features quant-prep

  # ---------------------------------------------------------------------------
  # Bare-metal measurement, for numbers rather than coverage.
  #
  # A hosted runner is virtualised and shared, so timings from one describe the
  # runner, not the hardware anyone runs this on. Every GFLOP/s figure in the
  # README came from an M5 Pro; this is where a regression against those would
  # show up.
  #
  # Gated on a repository variable rather than merely targeting `self-hosted`,
  # because a job whose runner labels match nothing queues indefinitely instead
  # of skipping. Set HAS_METAL_RUNNER to `true` under
  # Settings -> Secrets and variables -> Actions -> Variables once a runner
  # exists.
  #
  # Same guard as the `gpu` job. See the comment there: the guard is not a
  # security boundary, and the owner settings listed there are the real controls.
  # ---------------------------------------------------------------------------
  bench:
    name: GEMM sweep on bare metal
    if: ${{ vars.HAS_METAL_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No `cargo test` here: the `gpu` job above runs the suite on this same
      # runner. This job is for numbers.
      - name: Bit-exact parity probe against the reference SIMD path
        run: cargo run --release --bin probe_gemm_parity
      - name: GEMM sweep
        # Not a gate — the numbers land in the job log so a throughput
        # regression is visible without anyone running it by hand.
        run: cargo run --release --bin bench_gemm_sweep
