name: Metal compile

# Apple's Metal compiler over the kernels, on GitHub-hosted macOS only.
#
# CI's `gpu` and `bench` jobs run on a self-hosted Mac; this workflow never
# does. It compiles and links, and runs nothing on a GPU, so it can check a
# branch whose kernels have never met a Metal compiler without putting them on
# anyone's hardware.
on:
  push:
    paths:
      - "kernels/**"
      - "src/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/metal-compile.yml"
  pull_request:
    paths:
      - "kernels/**"
      - "src/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/metal-compile.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compile:
    name: Metal 4 compile + link (no GPU)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Report the toolchain
        run: |
          echo "xcode-select: $(xcode-select -p)"
          xcodebuild -version
          sw_vers

      - name: Install the Metal Toolchain
        run: |
          if xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler already present: $(xcrun --find metal)"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Build everything, every kernel under -Wall -Werror (the real build.rs, every test target)
        # build.rs owns the flag list and the source list. TESSL_METAL_WERROR=1
        # compiles every kernels/*.metal with its exact flags (fast math, the
        # per-file -ffp-contract=off) plus -Wall -Werror, and refuses the
        # metal3.2 fallback; TESSL_GEMM_TUNE=1 adds every kernels/tune/ source.
        # pipefail: without it `tee` would turn a failed build into a pass.
        env:
          TESSL_METAL_WERROR: "1"
          TESSL_GEMM_TUNE: "1"
        run: |
          set -o pipefail
          cargo build --release --all-targets 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: No kernel fell back to metal3.2
        run: |
          if grep -q "falling back to -std=metal3.2" "$RUNNER_TEMP/build.log"; then
            grep -A40 "falling back to -std=metal3.2" "$RUNNER_TEMP/build.log"
            echo "::error::a kernel only compiled under the metal3.2 fallback"
            exit 1
          fi
          echo "every kernel compiled under -std=metal4.0"

      - name: Check every Qwen3.5 / training / encoder entry point is exported by the built metallib
        run: |
          set -euo pipefail
          # Newest build's artifact (a `for` glob, not `ls -t`: shellcheck SC2012).
          metallib=""
          for candidate in target/release/build/*/out/default-*.metallib; do
            if [[ -z "$metallib" || "$candidate" -nt "$metallib" ]]; then metallib="$candidate"; fi
          done
          if [[ ! -f "$metallib" ]]; then
            echo "::error::no target/release/build/*/out/default-*.metallib was built"
            exit 1
          fi
          echo "metallib: $metallib"
          # To a file first: `strings | grep -q` under pipefail can report a
          # false miss when grep exits early and strings takes SIGPIPE.
          strings "$metallib" > "$RUNNER_TEMP/symbols.txt"
          missing=0
          for fn in qwen35_conv1d_silu qwen35_gdn_chunk_prep qwen35_gdn_chunk_scan qwen35_gdn_chunk_scan_bv16 qwen35_gdn_recurrent qwen35_gdn_recurrent_bv16 \
                    qwen35_gdn_recurrent_simd qwen35_gdn_recurrent_simd_l8_vec qwen35_gdn_recurrent_simd_pre_l8_vec qwen35_gdn_simd_prep \
                    qwen35_gated_rms_norm_f32 qwen35_gated_rms_norm_bf16 qwen35_attn_qk_norm_rope \
                    qwen35_attn_qk_norm_rope_posbuf qwen35_attn_gate_f32 qwen35_attn_gate_bf16 \
                    qwen35_attn_prefix_rows qwen35_attn_prefix_decode_partial \
                    qwen35_attn_prefix_decode_reduce qwen35_attn_tiled_h256_q32_k32_sg4 \
                    qwen35_attn_tiled_h256_q32_k64_sg4 qwen35_attn_tiled_h256_q64_k32_sg8 \
                    qwen35_attn_tiled_h256_q64_k64_sg8 qwen35_swiglu_f32 qwen35_swiglu_bf16 qwen35_residual_add_f32 qwen35_rms_norm_f32 qwen35_rms_norm_bf16 qwen35_score_rows_f32 qwen35_score_rows_bf16 \
                    qwen35_embed_rows_bf16 qwen35_embed_rows_f32 ce_gather_rows_f32 ce_gather_rows_bf16 ce_lse_update ce_softmax_grad gdn_train_fwd gdn_train_bwd gdn_train_bwd_finish \
                    qwen35_rms_norm_bwd_f32 qwen35_col_sum_blocks_f32 qwen35_gated_rms_norm_bwd_f32 \
                    qwen35_swiglu_bwd_f32 qwen35_attn_gate_bwd_f32 \
                    qwen35_conv1d_silu_bwd_dx_f32 qwen35_conv1d_silu_bwd_dw_f32 qwen35_attn_qk_norm_rope_bwd_f32 \
                    qwen35_embed_rows_bwd_f32 qwen35_attn_tiled_lse_h256_q32_k32_sg4 qwen35_attn_bwd_dvec_f32 \
                    qwen35_attn_bwd_dq_h256_q32_k32_sg4 qwen35_attn_bwd_dk_h256_q32_k32_sg4 \
                    qwen35_attn_bwd_dv_h256_q32_k32_sg4 qwen35_gdn_gates_f32 qwen35_gdn_gates_bwd_f32 \
                    qwen35_copy_cols_f32 qwen35_scatter_add_rows_f32 qwen35_adamw_f32 qwen35_sq_sum_pieces qwen35_sum_exact_f32 \
                    qwen35_gelu_tanh_glu_f32 qwen35_gelu_tanh_glu_bf16 qwen35_embed_rows_bf16_scaled \
                    encoder_attn_tiled_h256_q32_k32_sg4 encoder_attn_tiled_h512_q32_k32_sg8 \
                    encoder_attn_rows_h256_r16_g32 encoder_attn_rows_h512_r32_g32 segment_mean_rows_f32 l2_normalize_rows_f32 \
                    vision_qkv_norm_rope_f32 vision_pos_embed_add_f32 vision_pool_members_f32; do
            if grep -qx "$fn" "$RUNNER_TEMP/symbols.txt"; then
              echo "exported: $fn"
            else
              echo "::error::$fn is not in the linked metallib"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "strings in the metallib that mention qwen35:"
            grep qwen35 "$RUNNER_TEMP/symbols.txt" || true
          fi
          exit $missing

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Clippy (quant-prep)
        # `mtl_tensor` is compiled only with `quant-prep`.
        run: cargo clippy --release --all-targets --features quant-prep -- -D warnings
