name: Release

# Tag-triggered publish. Manual `cargo publish` without this workflow used to
# leave GitHub Releases empty while crates.io moved — Status links in the
# CHANGELOG footers then pointed at missing release pages. This job is the
# single path that keeps tag, crates.io, and GitHub Release in lockstep.
#
# Gates (all fail closed):
#   * Publishing (a tag push, or workflow_dispatch with dry_run=false) requires
#     CI and Metal compile to have concluded `success` for exactly $GITHUB_SHA
#     (scripts/require_green_ci.sh). A missing, running, failed, or unqueryable
#     run blocks the publish.
#   * Publishing also requires the ref to be a `v*` tag whose version equals
#     Cargo.toml. A dispatch from a branch is therefore only ever a dry run,
#     which publishes nothing and so needs neither the tag nor the CI gate.
#   * The GitHub Release is created with --target "$GITHUB_SHA", so it points at
#     the commit that was verified.
#
# Pushing a tag (edge cases of the CI gate, by design not waited out):
#   * Push the tag after CI and Metal compile on that commit have finished. The
#     gate does not wait for a run still in progress, it refuses; re-run this
#     job once they are green.
#   * metal-compile.yml runs only for pushes touching its path filter (kernels/,
#     src/, tests/, build.rs, Cargo.toml, Cargo.lock, the workflow itself). A tag
#     on a commit with no Metal-compile run is refused as "no run". Dispatch it
#     on the tag first, then re-run this job:
#         gh workflow run metal-compile.yml --ref vX.Y.Z
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'cargo publish --dry-run only'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read   # require_green_ci.sh lists workflow runs

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: verify + publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Require green CI for this exact commit
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/require_green_ci.sh "$GITHUB_SHA" ci.yml metal-compile.yml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Metal Toolchain
        run: |
          if xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler already present: $(xcrun --find metal)"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Tag matches Cargo.toml version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # Anything that publishes must come from a v* tag matching Cargo.toml.
          # Only a dispatch dry run (publishes nothing) may run from a branch.
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.dry_run }}" == "false" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
              echo "error: publishing requires a v* tag ref, got $GITHUB_REF_TYPE '$GITHUB_REF_NAME'" >&2
              exit 1
            fi
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "error: tag v$TAG does not match Cargo.toml $VERSION" >&2
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release readiness (version triad + package denylist)
        run: |
          chmod +x scripts/check_release_ready.sh
          ./scripts/check_release_ready.sh

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            cargo publish --locked --dry-run
            exit 0
          fi
          # Prefer the Actions secret; fall back to a no-op when the crate is
          # already on crates.io (local `cargo publish` then tag-push).
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            if curl -fsSLA 'tessl-release/1.0' "https://crates.io/api/v1/crates/tessl/${VERSION}" >/dev/null; then
              echo "CARGO_REGISTRY_TOKEN unset, but tessl ${VERSION} is already on crates.io — skipping upload"
              exit 0
            fi
            echo "error: CARGO_REGISTRY_TOKEN secret is not set and ${VERSION} is not on crates.io" >&2
            exit 1
          fi
          if cargo publish --locked 2>&1 | tee /tmp/publish.log; then
            exit 0
          fi
          if grep -Eq 'already uploaded|crate version .* already exists' /tmp/publish.log; then
            echo "version already on crates.io — treating as success"
            exit 0
          fi
          exit 1

      - name: Create GitHub Release from CHANGELOG
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          BODY_FILE="$(mktemp)"
          # The section extractor is src/bin/release_check.rs (std only, so a bare rustc builds it).
          rustc --edition 2021 -O -o "$RUNNER_TEMP/release_check" src/bin/release_check.rs
          "$RUNNER_TEMP/release_check" changelog-section CHANGELOG.md "$VERSION" >"$BODY_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "tessl ${VERSION}" --notes-file "$BODY_FILE"
          fi
