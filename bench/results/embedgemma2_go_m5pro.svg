<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="647.8" viewBox="0 0 1400 647.8" role="img">
<title>tessl from Go over gusset: the cost of the boundary against the same call made from Rust (Apple M5 Pro)</title>
<style>
text{font-family:-apple-system,Helvetica,Arial,sans-serif}
.ink{fill:#0b0b0b}.mut{fill:#52514e}.dim{fill:#898781}.bold{font-weight:600}
