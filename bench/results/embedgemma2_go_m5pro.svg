<rect class="bg" width="100%" height="100%"/>
<text class="ink" x="14" y="26" font-size="15" font-weight="600">tessl from Go over gusset: the cost of the boundary against the same call made from Rust (Apple M5 Pro)</text>
<text class="mut" x="14" y="40.8" font-size="11.5">Tiny multimodal checkpoint, one call per point; minimum of 1350 calls (9 rounds of 150) per arm, the arms alternating in separate processes, and all arms&apos; outputs are bit-identical. 1-minute load average 3.9 before, 5.6 after.</text>
