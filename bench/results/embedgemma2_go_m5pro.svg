<text class="ink" x="14" y="26" font-size="15" font-weight="600">tessl from Go over gusset: the cost of the boundary against the same call made from Rust (Apple M5 Pro)</text>
<text class="mut" x="14" y="40.8" font-size="11.5">Tiny multimodal checkpoint, one call per point; minimum of 3000 calls (15 rounds of 200) per arm, the arms alternating in separate processes, and all arms&apos; outputs are bit-identical. Indicative: a shared machine.</text>
