<text class="ink" x="14" y="26" font-size="15" font-weight="600">JPEG decoding, native against ImageIO, one call per file (Apple M5 Pro)</text>
<text class="mut" x="14" y="40.8" font-size="11.5">Bars are the minimum of N interleaved calls; the tick is the median. Indicative, not a paired comparison; the machine&apos;s load is recorded in the .txt beside the data.</text>
