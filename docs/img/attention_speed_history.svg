<text class="t" x="20" y="26">Attention — tessl speedup over PyTorch MPS and MLX</text>
<text class="st" x="20" y="44">The files store tessl_ms / other_ms (bench/attn_paired.py:130), so speedup = its inverse; blue = tessl faster, red = slower.</text>
<text class="st" x="20" y="58">Geometric mean over each file’s configs. The files time different tessl implementations, so the rows are a history, not repeats.</text>
<text class="t" x="20" y="80">Geomean speedup per result file</text>
