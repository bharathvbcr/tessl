<text class="t" x="20" y="26">GEMM sweep — GFLOP/s, higher is better</text>
<text class="st" x="20" y="44">One run per lane, not paired, so not a tessl-vs-PyTorch claim (see the paired figure).</text>
<text class="st" x="20" y="58">Inferred to predate the cooperative-destination bf16 kernel: the file is undated, tessl bf16 here is ~11k GFLOP/s,</text>
<text class="st" x="20" y="72">matching the pre-landing 8–12k baseline in bf16_tile_tune_FINDINGS.md, not the ~26k of the landed kernel.</text>
